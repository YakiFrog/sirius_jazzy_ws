<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101216">
<title>SiriusLauncher Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236b8aff'/%3E%3Cpath d='M22 9H13l-5 7h16l-5 7H10' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
html,body{height:100%;margin:0;background:#101216;overflow:hidden}
#app{display:block;width:100%;height:100%;border:0;background:#101216}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#8aa3ff;font:13px "Noto Sans JP",sans-serif;pointer-events:none;transition:opacity .2s}
</style>
</head>
<body>
<div id="boot">読み込み中…</div>
<iframe id="app" title="SiriusLauncher" src="/console" allow="fullscreen"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const hash=location.hash&&location.hash!=='#'?location.hash:'#home';
  frame.src='/console'+hash;
  frame.addEventListener('load',()=>{document.getElementById('boot').style.opacity='0';});
  window.siriusToggleFullscreen=async function(){
    try{
      if(document.fullscreenElement)await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    }catch(error){
      try{frame.contentWindow.postMessage({type:'sirius:toast',message:'ブラウザの F11 でもフルスクリーンにできます'},location.origin);}catch(_){}
    }
  };
  window.siriusReloadApp=function(){
    if(frame.contentWindow)frame.contentWindow.location.reload();
  };
  window.addEventListener('message',function(event){
    if(event.origin!==location.origin||!event.data)return;
    if(event.data.type==='sirius:page'&&event.data.page){
      try{history.replaceState(null,'','#'+event.data.page);}catch(_){}
    }
  });
})();
</script>
</body>
</html>
