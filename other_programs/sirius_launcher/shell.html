<!doctype html>
<html lang="ja" data-safe-shell>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>SiriusLauncher</title>
<link rel="icon" type="image/png" href="/static/branding/sirius-icon.png">
<style>
html{--shell-bg:#0f151f;height:100%;background:var(--shell-bg)}
html[data-theme=light]{--shell-bg:#f2f5fa}
body{box-sizing:border-box;height:100dvh;margin:0;background:var(--shell-bg);overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#app{display:block;width:100%;height:100%;border:0;background:var(--shell-bg)}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#8aa3ff;font:13px "Noto Sans JP",sans-serif;pointer-events:none;transition:opacity .2s}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sirius-theme')||'dark';document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='light'?'#f2f5fa':'#0f151f';}catch(_){}</script>
<link rel="manifest" href="/static/manifest.webmanifest"><meta name="application-name" content="SiriusLauncher"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="SiriusLauncher"><link rel="apple-touch-icon" href="/static/branding/sirius-icon.png"><link rel="stylesheet" href="/static/app-install.css"><script defer src="/static/app-install.js"></script>
</head>
<body>
<div id="boot">読み込み中…</div>
<iframe id="app" title="SiriusLauncher" src="/console" allow="fullscreen"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  const hash=location.hash&&location.hash!=='#'?location.hash:'#home';
  frame.src='/console'+hash;
  let themeObserver=null;
  frame.addEventListener('load',()=>{
    document.getElementById('boot').style.opacity='0';
    if(themeObserver)themeObserver.disconnect();
    try{const root=frame.contentDocument.documentElement;
      const sync=()=>{const theme=root.dataset.theme==='light'?'light':'dark';document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='light'?'#f2f5fa':'#0f151f';};
      themeObserver=new MutationObserver(sync);themeObserver.observe(root,{attributes:true,attributeFilter:['data-theme']});sync();
    }catch(_){}
  });
  window.siriusToggleFullscreen=async function(){
    try{
      if(document.fullscreenElement)await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    }catch(error){
      try{frame.contentWindow.postMessage({type:'sirius:toast',message:'ブラウザの F11 でもフルスクリーンにできます'},location.origin);}catch(_){}
    }
  };
  window.siriusReloadApp=function(){
    if(frame.contentWindow)frame.contentWindow.location.reload();
  };
  window.addEventListener('message',function(event){
    if(event.origin!==location.origin||!event.data)return;
    if(event.data.type==='sirius:page'&&event.data.page){
      try{history.replaceState(null,'','#'+event.data.page);}catch(_){}
    }
  });
})();
</script>
</body>
</html>
