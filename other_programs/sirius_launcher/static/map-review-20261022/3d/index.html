<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c1420;color:#eef4fb;font-family:system-ui,-apple-system,sans-serif}#view{position:fixed;inset:0;touch-action:none}canvas{display:block}.top{position:fixed;top:0;left:0;right:0;padding:calc(16px + env(safe-area-inset-top)) 18px 12px;background:linear-gradient(#0c1420f5,#0c1420d0,transparent);pointer-events:none}h1{margin:0;font-size:19px;letter-spacing:.03em}.sub{font-size:12px;color:#b2c2d5;margin-top:6px;line-height:1.6}.tag{display:inline-block;color:#82e9df;font-size:11px;letter-spacing:.08em;margin-bottom:5px}.panel{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:12px;right:12px;border:1px solid #46566c88;background:#131f30f0;border-radius:18px;padding:12px;box-shadow:0 12px 38px #0006;backdrop-filter:blur(14px)}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button,.image-link{font:inherit;font-size:14px;color:#e8f3ff;background:#233247;border:1px solid #435770;border-radius:10px;min-height:44px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8fe9df;outline-offset:2px}button.active{color:#081b22;background:#8fe9df;border-color:#8fe9df}.color-modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.color-modes button{min-height:36px;font-size:13px}.options{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;font-size:13px}label{display:flex;align-items:center;gap:8px;min-height:38px}input{accent-color:#8fe9df;width:19px;height:19px}.hint{font-size:11px;color:#a9bcd3;text-align:center;margin:8px 0 0}.image-link{text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;font-size:12px}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#0c1420;z-index:5;text-align:center;padding:24px;line-height:1.8}.loading[hidden]{display:none}#notice{max-width:350px}#legend{position:fixed;top:cal </style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<div id="view"></div><div class="top"><div class="tag">SIRIUS · MAP REVIEW</div><h1>オフライン3D地図（既知床補正）</h1><div class="sub" id="summary">全行程を読み込み中…</div></div><div id="legend">高い<i></i>低い</div>
<div class="panel"><div class="buttons"><button class="active" data-camera="oblique">斜め</button><button data-camera="top">真上</button><button data-camera="side">横から</button></div><div class="color-modes"><button id="cameraColor">カメラ色</button><button id="heightColor" class="active">高さ色</button></div><div class="options"><label><input id="roof" type="checkbox" checked>天井を隠す</label><label><input id="route" type="checkbox" checked>軌跡</label><a class="image-link" href="overview.png">画像で見る</a></div><p class="hint">1本指で回転 · 2本指で移動／拡大</p></div>
<div class="loading" id="loading"><div id="notice">地図を読み込んでいます…</div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';
const $=id=>document.getElementById(id);
try {
 const [meta,buffer,routeBuffer,colorBuffer]=await Promise.all([fetch('./map.json').then(r=>{if(!r.ok)throw Error('地図情報を取得できません');return r.json()}),fetch('./points.bin').then(r=>{if(!r.ok)throw Error('点群を取得できません');return r.arrayBuffer()}),fetch('./trajectory.bin').then(r=>r.arrayBuffer()),fetch('./colors.bin').then(r=>r.ok?r.arrayBuffer():null)]);
 const positions=new Float32Array(buffer);if(positions.length!==meta.preview_points*3)throw Error('点群のサイズが一致しません');
 const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x0c1420);$('view').appendChild(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.03,800);camera.up.set(0,0,1);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.1;controls.minDistance=2;controls.maxDistance=200;controls.maxPolarAngle=Math.PI*.98;
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));const hasRGB=!!colorBuffer&&colorBuffer.byteLength===meta.preview_points*3;geometry.setAttribute('pointColor',new THREE.BufferAttribute(hasRGB?new Uint8Array(colorBuffer):new Uint8Array(meta.preview_points*3).fill(128),3,true));
 const material=new THREE.ShaderMaterial({uniforms:{minZ:{value:meta.z_range[0]},maxZ:{value:meta.z_range[1]},clipZ:{value:1.35-meta.center[2]},pointScale:{value:180},useCameraColor:{value:0}},vertexShader:`uniform float minZ,maxZ,pointScale;attribute vec3 pointColor;varying vec3 rgb;varying float h,z;void main(){rgb=pointColor;z=position.z;h=clamp((z-minZ)/max(.1,maxZ-minZ),0.,1.);vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;gl_PointSize=clamp(pointScale/-p.z,1.3,5.0);}`,fragmentShader:`uniform float clipZ,useCameraColor;varying vec3 rgb;varying float h,z;void main(){if(z>clipZ)discard;vec2 p=gl_PointCoord-.5;if(dot(p,p)>.25)discard;vec3 c=h<.5?mix(vec3(.16,.46,.69),vec3(.49,.89,.85),h*2.):mix(vec3(.49,.89,.85),vec3(1.,.8,.44),(h-.5)*2.);gl_FragColor=vec4(mix(c,rgb,useCameraColor),1.);}`});
 scene.add(new THREE.Points(geometry,material));
 const route=new THREE.Group(),lineGeom=new THREE.BufferGeometry();lineGeom.setAttribute('position',new THREE.BufferAttribute(new Float32Array(routeBuffer),3));route.add(new THREE.Line(lineGeom,new THREE.LineBasicMaterial({color:0xffb85c,depthTest:false})));scene.add(route);
 const routePts=new Float32Array(routeBuffer);for(const [index,color] of [[0,0x80efb1],[routePts.length-3,0xff8ca8]]){const marker=new THREE.Mesh(new THREE.SphereGeometry(.12,12,8),new THREE.MeshBasicMaterial({color,depthTest:false}));marker.position.set(routePts[index],routePts[index+1],routePts[index+2]);route.add(marker)}
 const grid=new THREE.GridHelper(60,60,0x35485c,0x1a2b3d);grid.rotation.x=Math.PI/2;grid.position.z=-.68-meta.center[2];scene.add(grid);
 const pathBox=new THREE.Box3().setFromBufferAttribute(lineGeom.attributes.position);const span=pathBox.getSize(new THREE.Vector3());const focus=pathBox.getCenter(new THREE.Vector3());focus.z=-.05-meta.center[2];
 function view(mode){const distance=Math.max((span.x+8)/(.828*camera.aspect),(span.y+8)/(.828*.72))*1.1;controls.target.copy(focus);let offset=mode==='top'?new THREE.Vector3(0,-.001,distance*1.1):mode==='side'?new THREE.Vector3(0,-distance,.6):new THREE.Vector3(distance*.65,-distance*.7,distance*.7);camera.position.copy(focus).add(offset);camera.lookAt(focus);controls.update();document.querySelectorAll('[data-camera]').forEach(b=>b.classList.toggle('active',b.dataset.camera===mode))}
 document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>view(b.dataset.camera));$('roof').onchange=()=>material.uniforms.clipZ.value=$('roof').checked?1.35-meta.center[2]:1e5;$('route').onchange=()=>route.visible=$('route').checked;
 function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();view('oblique');
 function setColor(mode){const cameraMode=mode==='camera'&&hasRGB;material.uniforms.useCameraColor.value=cameraMode?1:0;$('cameraColor').classList.toggle('active',cameraMode);$('heightColor').classList.toggle('active',!cameraMode);$('legend').hidden=cameraMode;$('summary').textContent=cameraMode?'BAGのカメラ画像で色付け · 未観測は灰色':'高さで色分け · 軌跡はオレンジ色';document.querySelector('.image-link').href=cameraMode?'overview_rgb.png':'overview.png';window.dispatchEvent(new Event('colorchange'))} $('cameraColor').disabled=!hasRGB;$('cameraColor').onclick=()=>setColor('camera');$('heightColor').onclick=()=>setColor('height');setColor(hasRGB?'camera':'height');window.reviewColor=setColor;
 $('loading').hidden=true;window.reviewReady=true;window.reviewMeta=meta;window.reviewView=view;
 let dirty=true;addEventListener('colorchange',()=>dirty=true);controls.addEventListener('change',()=>dirty=true);$('roof').addEventListener('change',()=>dirty=true);$('route').addEventListener('change',()=>dirty=true);addEventListener('resize',()=>dirty=true);renderer.setAnimationLoop(()=>{if(controls.update()||dirty){renderer.render(scene,camera);dirty=false}});
} catch(error){console.error(error);$('notice').innerHTML='地図を表示できませんでした。<br><a href="overview.png" style="color:#8fe9df">俯瞰画像を開く</a>';window.reviewError=String(error)}
</script></body></html>
