roboteq_ros2_driver:
  ros__parameters:
    pub_odom_tf: true
    odom_frame: "sirius3/odom"
    base_frame: "sirius3/base_footprint"
    cmdvel_topic: "cmd_vel"
    odom_topic: "odom"
    port: "/dev/roboteq"
    baud: 230400
    open_loop: false
    wheel_circumference: 0.825 # タイヤを紐で一周した長さ(m)
    track_width: 0.40
    max_amps: 12.0
    max_rpm: 58
    gear_ratio: 1.0  # pulseが既に車輪1回転あたりのカウント数を表す場合は1.0に設定
    pulse: 475  # エンコーダのパルス数（車輪1回転あたり）
    max_speed: 1.5  # m/s
    # Roboteqストリームはラウンドロビン(1周期1クエリ)。全テレメトリを5msで回すと各約29Hz。
    odom_stream_interval_ms: 5
    odom_publish_hz: 20.0
    # 電圧/電流/フォルト等のテレメトリ配信
    publish_status: true
    status_topic: "roboteq/status"
    status_publish_hz: 20.0
    # ソフトウェア閉ループ車輪速度制御(エンコーダ速度フィードバック + FF + PI)
    # 規定: 有効。蛇行・左右差・過電圧を改善(15F-0925ループで検証)。
    # falseにすると従来のオープンループ指令。
    closed_loop: true
    cl_kp: 120.0        # duty / (m/s)  15F-0925ループで最良
    cl_ki: 250.0        # duty / (m/s*s)
    cl_kd: 0.0
    cl_control_hz: 50.0
    cl_max_duty: 1000
    cl_anti_windup: 0.5  # 積分クランプ(m/s*s) ※コード側で400/kiも適用
    cl_min_speed: 0.0    # デッドバンド補償(0=無効)。0.15で試したが速度ディップ悪化のため無効化
    cl_duty_slew: 3000.0 # duty変化の上限[duty/s] 回生スパイク抑制
    cl_duty_lpf_tau: 0.08 # duty出力ローパス時定数[s] 速度振動抑制
    cl_feedback_alpha: 0.5 # 車輪速度フィードバック平滑化(小=強い) 0.3は蛇行悪化のため0.5
    speed_scale: 0.52 # 速度指令のスケーリング係数: 0.50 でほぼ司令した通りの速度になる
    # 55% はやすぎる
    # 45% おそすぎる
    kp_soft: 0.3  # ソフトウェアP制御用のゲイン (0.6 -> 0.3 に減衰させて急激なトルク変化を防止)
    min_speed_threshold: 0.18  # 低速時の底上げしきい値 (0.18 * speed_scale = 0.094 m/s -> モーター出力約117となり静止摩擦を突破可能)
    # 機体ごとのモーター結線・エンコーダ方向。値は +1.0 または -1.0。
    # ここの値は他ロボットで動作中の共通既定値。
    motor_sign_r: 1.0
    motor_sign_l: -1.0
    encoder_sign_r: -1.0
    encoder_sign_l: 1.0
    # 1回のストリーム受信で許容する最大車輪回転量。カウンタ飛び防止。
    max_encoder_step_revolutions: 0.25
