<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点字と歩道の位置関係</title><style>body{font:16px system-ui;margin:12px;line-height:1.65;background:#101820;color:#eff5f8}h1{font-size:24px}img{display:block;width:100%;max-width:1000px;margin:12px 0 28px}a{color:#8ed8ff}p{padding:12px;background:#253643}</style><h1>点字と歩道の位置関係を使う比較</h1><p>上：追加前／中：点字の関係を追加／下：元の路面テクスチャ。連続した点字の途中は歩道の手掛かりにします。端点・分岐・広い警告部は手掛かりから除外します。点字の両側を無条件に歩道にする処理ではありません。点字・芝生・元のRGBは保持しています。</p><a href="../../../../maps_waypoints/maps/theta_semantic_tactile_context_map_20261020/images.html">比較版の全体地図・3種類の画像</a><h2>点字脇の床</h2><a href="context_floor.jpg"><img src="context_floor.jpg" loading="lazy" alt="点字脇の床の補正前後"></a><h2>広い範囲では誤認識も残る</h2><a href="context_band.jpg"><img src="context_band.jpg" loading="lazy" alt="広い範囲では誤認識も残るの補正前後"></a><h2>確認用：縁石外側の車道</h2><a href="curb_control.jpg"><img src="curb_control.jpg" loading="lazy" alt="確認用：縁石外側の車道の補正前後"></a><p>同じ記録で16条件を試した探索結果です。切り出した領域での比較であり、独立した正解データによる精度評価ではありません。既存の全体地図も保持しています。</p></html>
